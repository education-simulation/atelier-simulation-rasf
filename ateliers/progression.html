<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progression · Atelier simulation</title>
<!--
  PAGE DE PROGRESSION de l'atelier (ne pas modifier). Elle relit toute seule, toutes les 2 secondes, le petit fichier
  progression.js du même dossier : c'est LUI que l'IA réécrit à chaque étape (étape en cours, ce qu'il faut faire, alerte).
-->
<style>
html { background:#e9ecf2; }
body { margin:0; padding:22px 14px 150px; font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; color:#e4e4e7; display:flex; justify-content:center; }
.fen { width:min(980px,100%); background:#0b0b0f; border-radius:16px; overflow:hidden; box-shadow:0 18px 50px rgba(15,23,42,.35); }
.barre { display:flex; align-items:center; gap:8px; padding:10px 16px; background:#18181b; border-bottom:1px solid #27272a; }
.barre i { width:11px; height:11px; border-radius:50%; background:#3f3f46; }
.barre b { margin-left:8px; color:#fff; font-size:14px; }
.barre em { margin-left:auto; font-style:normal; font-size:12px; color:#a1a1aa; border:1px solid #3f3f46; border-radius:99px; padding:2px 10px; }
.corps { padding:18px 20px 22px; display:grid; gap:16px; }
h1 { margin:0; font:800 clamp(20px,3vw,28px)/1.2 'Outfit',system-ui,sans-serif; color:#fff; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1 small { font:800 15px 'Nunito',system-ui,sans-serif; color:#a1a1aa; }
.st { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
.st li { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; position:relative; }
.st li:not(:last-child)::after { content:""; position:absolute; top:18px; left:calc(50% + 22px); right:calc(-50% + 22px); height:3px; background:#3f3f46; }
.st li.fait:not(:last-child)::after { background:#22c55e; }
.rond { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:#27272a; color:#a1a1aa; border:2px solid #3f3f46; box-sizing:border-box; }
.fait .rond { background:#22c55e; color:#052e14; border-color:#22c55e; }
.ici .rond { background:#f59e0b; color:#1f1300; border-color:#fde68a; box-shadow:0 0 0 5px rgba(245,158,11,.25); }
.st span.nom { font-size:12.5px; line-height:1.25; color:#a1a1aa; }
.ici span.nom { color:#fde68a; font-weight:800; }
.carte { border:2px solid #f59e0b; background:#1f1a10; border-radius:14px; padding:14px 16px; display:grid; gap:10px; }
.carte h2 { margin:0; font:800 20px/1.25 'Outfit',system-ui,sans-serif; color:#fff; }
.badge { font-size:12px; font-weight:800; background:#f59e0b; color:#1f1300; border-radius:99px; padding:2px 9px; vertical-align:middle; margin-left:6px; }
.carte p { margin:0; font-size:16px; line-height:1.5; }
.rangee { display:flex; flex-wrap:wrap; gap:8px; }
.btn { text-decoration:none; background:#27272a; border:1px solid #52525b; color:#fff; font-weight:800; font-size:15px; border-radius:10px; padding:8px 14px; }
.btn:hover { border-color:#f59e0b; }
.btn.vert { background:#16a34a; border-color:#16a34a; }
.toi { margin:0; background:#0b0b0f; border:2px dashed #f59e0b; border-radius:10px; padding:10px 12px; color:#fde68a; font-weight:800; font-size:17px; }
.toi.alerte { border-color:#dc2626; color:#fca5a5; }
.voile { position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.7); display:grid; place-items:center; padding:12px; }
.popup { position:relative; width:min(1100px,100%); height:min(820px,94vh); background:#fff; border-radius:14px; overflow:hidden; }
.popup iframe { width:100%; height:100%; border:0; }
.popup .fermer { position:absolute; top:8px; right:8px; z-index:2; border:0; cursor:pointer; background:#0b0b0f; color:#fff; font-weight:800; font-size:14px; border-radius:8px; padding:7px 13px; }
.popup .fermer:hover { background:#dc2626; }
details { background:#16161b; border:1px solid #3f3f46; border-radius:10px; padding:8px 12px; }
summary { cursor:pointer; font-weight:800; }
details ul { margin:8px 0 2px; padding-left:20px; line-height:1.5; }
.carte .st { margin:4px 0; }
.bravo { margin:0; text-align:center; font:800 22px 'Outfit',system-ui,sans-serif; color:#86efac; }
.bande { position:fixed; left:0; right:0; bottom:40px; z-index:40; display:flex; align-items:center; gap:12px; background:#f59e0b; color:#1f1300; padding:10px 16px; box-shadow:0 -6px 24px rgba(15,23,42,.25); font-size:16px; line-height:1.35; }
.bande.alerte { bottom:140px; background:#dc2626; color:#fff; animation:alerte 1.2s ease-in-out infinite; }
@keyframes alerte { 50% { box-shadow:0 0 0 6px rgba(220,38,38,.35); } }
.fleche { font-size:34px; font-weight:800; animation:fleche 1.1s ease-in-out infinite; }
@keyframes fleche { 50% { transform:translateX(-8px); } }
.bande b { font-size:19px; }
.bande em { font-style:normal; font-size:15px; }
.quoi { display:block; margin-top:3px; font-size:17px; font-weight:800; }
.mini { background:#1c1c22; color:#d4d4d8; border:1px solid #52525b; border-radius:10px; padding:6px 10px; font-size:12px; line-height:1.5; min-width:230px; }
.mini .trois { background:#f59e0b; color:#1f1300; border-radius:5px; font-weight:800; padding:0 4px; }
.mini .submit { float:right; background:#2563eb; color:#fff; border-radius:7px; padding:0 8px; font-weight:800; }
@media (max-width:640px) { .bande { flex-wrap:wrap; } .mini { display:none; } .st span.nom { font-size:11px; } }
</style>
</head>
<body>
<div class="fen">
  <div class="barre"><i></i><i></i><i></i><b>Atelier · Progression</b><em>ce n'est pas ta simulation</em></div>
  <div class="corps" id="corps"></div>
</div>
<div id="bande"></div>

<script>
const AIDE = "https://education-simulation.github.io/atelier-simulation-rasf/";
// Les 3 grandes étapes ; à l'étape 3, les sous-étapes de la simulation choisie (progression.js : simulation, sous).
const ETAPES = [
  { titre: "Découvrir Antigravity", texte: "Si tu veux, une démo d'environ 1 minute, ou l'écran d'Antigravity numéroté, à explorer à ton rythme. Tu peux aussi passer cette étape.",
    liens: [["🧭 Découvrir Antigravity", AIDE + "antigravity.html"], ["🔐 Les fenêtres d'autorisation", AIDE + "fenetres.html"]] },
  { titre: "Choisir ta simulation", texte: "Trois simulations au choix : le métamérisme (la page existe déjà, tu la fais fonctionner), l'avancement d'une réaction, ou un dosage (tu pars d'une page vide)." },
  { titre: "Construire ta simulation" },
];
const SIMULATIONS = {
  metamerisme: { nom: "Métamérisme", fichier: "metamerisme.html",
    texte: "Ta simulation est déjà dans ton dossier : en haut, ses étapes ; en dessous, la simulation. Les mêmes étapes qu'ici.",
    sous: [
      { titre: "L'état actuel de la page", objectif: "Sur ta simulation : regarde ce que fait la page, puis clique sur « J'ai regardé »." },
      { titre: "Les modèles", objectif: "Sur ta simulation : lis l'étape (et « Voir les modèles »), puis clique sur « J'ai compris »." },
      { titre: "Les boutons des illuminants", objectif: "Faire fonctionner les boutons A, D65 et F11 de la cabine." },
      { titre: "La couleur des cartes", objectif: "Choisir la couleur de la carte 1 ; la carte 2 forme avec elle une paire métamère." },
      { titre: "Les cartes mobiles", objectif: "Déplacer les deux cartes de la table jusque dans la cabine." },
      { titre: "L'écart de couleur", objectif: "Mesurer et afficher l'écart ΔE*ab entre les deux cartes." },
      { titre: "Le message à retenir", objectif: "Ajouter la conclusion de la simulation." },
    ] },
  avancement: { nom: "Avancement d'une réaction", fichier: "avancement.html",
    texte: "Tu pars d'une page vide : l'IA crée le fichier avancement.html à partir de ta demande.",
    sous: [
      { titre: "Le tableau d'avancement", exemple: "exemples/avancement.html",
        objectif: "Une simulation de la réaction aA + bB → cC + dD : l'avancement X varie de 0 à Xf, et un histogramme montre les quantités de matière.",
        pistes: ["Quoi modéliser ? La réaction aA + bB → cC + dD, avec les coefficients et les quantités initiales nA,0 … nD,0 modifiables.",
          "Quels calculs ? xA = nA,0/a, xB = nB,0/b, Xf = min(xA, xB) : le réactif limitant ; puis nA, nB, nC, nD pour tout X entre 0 et Xf.",
          "Quel affichage ? Un histogramme des 4 espèces qui se met à jour quand X change, l'équation, les quantités initiales et Xf. Un seul fichier HTML, à partager."] },
      { titre: "Ajuster ta simulation", objectif: "Ce que tu veux changer ou ajouter, avec tes mots." },
    ] },
  dosage: { nom: "Dosage", fichier: "dosage.html",
    texte: "Tu pars d'une page vide : l'IA crée le fichier dosage.html à partir de ta demande.",
    sous: [
      { titre: "Le dosage", exemple: "exemples/dosage.html",
        objectif: "Une simulation de dosage : on fait varier le volume VB d'espèce titrante versée, et un histogramme montre les quantités de matière.",
        pistes: ["Qui est qui ? A est l'espèce titrée (dans le bécher), B l'espèce titrante (dans la burette) ; on entre VB, de 0 à Veq et au-delà.",
          "Quels calculs ? nA,0 = cA·VA ; Veq = cA·VA·b / (a·cB) ; avant l'équivalence X = cB·VB / b ; après, B s'accumule : nB = cB·(VB − Veq).",
          "Quel affichage ? L'équation, cA, VA, cB, Veq, et l'histogramme des quantités de matière qui se met à jour avec VB."] },
      { titre: "L'exploitation d'un fichier de mesures", exemple: "exemples/dosage-exploitation.html",
        objectif: "Un 2e onglet pour importer un fichier de mesures (CSV ou Excel) et exploiter la courbe de dosage.",
        pistes: ["Quel fichier ? Un CSV ou un Excel : la page reconnaît la colonne du volume V et la grandeur mesurée (pH, potentiel…).",
          "Quel tracé ? La grandeur mesurée en fonction du volume.",
          "Quelle exploitation ? La dérivée première, la dérivée seconde, éventuellement les tangentes, pour trouver l'équivalence."] },
      { titre: "Ajuster ta simulation", objectif: "Ce que tu veux changer ou ajouter, avec tes mots." },
    ] },
};
const h = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const stepper = (liste, ici) => `<ol class="st" style="grid-template-columns:repeat(${liste.length},minmax(0,1fr))">${liste.map((x, i) => `
  <li class="${i + 1 < ici ? "fait" : i + 1 === ici ? "ici" : ""}"><span class="rond">${i + 1 < ici ? "✓" : i + 1}</span><span class="nom">${h(x.titre)}</span></li>`).join("")}</ol>`;
let dernier = "";

// Appelée par progression.js (réécrit par l'IA) : { etape, simulation, sous, quoi, alerte }.
window.progression = (p) => {
  const cle = JSON.stringify(p);
  if (cle === dernier) return;
  dernier = cle;
  const ici = Math.max(1, Math.min(ETAPES.length + 1, Number(p.etape) || 1));   // ETAPES.length + 1 = tout est fini
  const e = ETAPES[ici - 1];
  const sim = SIMULATIONS[p.simulation];
  const toi = `<p class="toi${p.alerte ? " alerte" : ""}">${p.alerte ? "🔐 Une petite fenêtre t'attend : clique sur 3 « Yes, and always allow », puis sur Submit." : `✍️ Ce qu'on attend de toi : ${h(p.quoi || "écris ta réponse dans Antigravity, puis Entrée.")}`}</p>`;
  let carte = "";
  if (e && ici === 3 && sim) {
    const n = Math.max(1, Math.min(sim.sous.length, Number(p.sous) || 1));
    const s = sim.sous[n - 1];
    carte = `<div class="carte"><h2>3. ${h(sim.nom)} <span class="badge">en cours</span></h2><p>${h(sim.texte)}</p>
      ${stepper(sim.sous, n)}
      <h2 style="font-size:18px">${n}. ${h(s.titre)}</h2>
      <p>🎯 ${h(s.objectif)}</p>
      ${toi}
      ${s.pistes ? `<details><summary>💡 Des pistes pour ta demande</summary><ul>${s.pistes.map((x) => `<li>${h(x)}</li>`).join("")}</ul></details>` : ""}
      <div class="rangee"><a class="btn vert" href="${sim.fichier}" target="_blank" rel="noopener">🎨 Ouvrir ma simulation</a>
      ${s.exemple ? `<button type="button" class="btn" data-popup="${AIDE + s.exemple}">👀 Voir un exemple de résultat</button>` : ""}</div></div>`;
  } else if (e) {
    carte = `<div class="carte"><h2>${ici}. ${h(e.titre)} <span class="badge">en cours</span></h2><p>${h(e.texte || "")}</p>${toi}
      ${e.liens ? `<div class="rangee">${e.liens.map(([t, u]) => `<button type="button" class="btn" data-popup="${u}">${t}</button>`).join("")}</div>` : ""}</div>`;
  } else carte = `<p class="bravo">🎉 Tu as fini l'atelier !</p>`;
  document.getElementById("corps").innerHTML = `
    <h1>Progression de ton atelier <small>${Math.min(ici - 1, ETAPES.length)} sur ${ETAPES.length}</small></h1>
    ${stepper(ETAPES.map((x, i) => (i === 2 && sim ? { titre: `${x.titre} : ${sim.nom}` } : x)), ici)}
    ${carte}`;
  document.getElementById("bande").innerHTML = p.alerte
    ? `<div class="bande alerte" role="alert"><span class="fleche" aria-hidden="true">⬅</span>
        <div class="mini" aria-hidden="true">📄 Allow access to this path?<br>1 Yes, allow this time<br>2 Yes, and always allow in this conversation<br><span class="trois">3 Yes, and always allow</span><br>4 No <span class="submit">Submit ↵</span></div>
        <span><b>🔐 Une petite fenêtre t'attend</b> <em>au-dessus de la zone de message, en bas à gauche</em><span class="quoi">👉 Clique sur 3 « Yes, and always allow », puis sur Submit.</span></span></div>`
    : `<div class="bande" role="note"><span class="fleche" aria-hidden="true">⬅</span>
        <span><b>Réponds à l'IA</b> <em>dans la zone de message d'Antigravity, en bas à gauche</em><span class="quoi">👉 ${h(p.quoi || "Écris ta réponse, puis Entrée.")}</span></span></div>`;
  document.title = `Progression · ${e ? e.titre : "fini"}`;
};

// Les pages d'aide (démo Antigravity, fenêtres d'autorisation) s'ouvrent dans une fenêtre par-dessus la page.
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-popup]");
  if (b) {
    const v = document.createElement("div");
    v.className = "voile";
    v.innerHTML = `<div class="popup" role="dialog" aria-modal="true"><button type="button" class="fermer">✕ Fermer</button><iframe src="${b.dataset.popup}" title="Aide"></iframe></div>`;
    v.addEventListener("click", (e) => { if (e.target === v || e.target.closest(".fermer")) v.remove(); });
    document.body.appendChild(v);
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelector(".voile")?.remove(); });

// Relit progression.js toutes les 2 secondes (un fichier de l'ordinateur : pas besoin de serveur).
function relire() {
  const s = document.createElement("script");
  s.src = "progression.js?t=" + Date.now();
  s.onload = s.onerror = () => s.remove();
  document.head.appendChild(s);
}
window.progression({ etape: 1, quoi: "Écris « continue », puis Entrée." });
relire();
setInterval(relire, 2000);
</script>
</body>
</html>
